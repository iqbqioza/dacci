name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify tag signature
        run: |
          curl -fsSL "https://github.com/iqbqioza.gpg" | gpg --import -
          gpg --list-keys "3C8DFA2DADDDD2213D049B507FDA9B2AAF0E2C0F"
          VERIFY_OUTPUT=$(git tag --verify "$GITHUB_REF_NAME" 2>&1)
          VERIFY_STATUS=$?
          echo "$VERIFY_OUTPUT"
          if [ $VERIFY_STATUS -ne 0 ]; then
            echo "Tag signature verification failed."
            exit 1
          fi
          if ! echo "$VERIFY_OUTPUT" | grep -q "3C8DFA2DADDDD2213D049B507FDA9B2AAF0E2C0F"; then
            echo "Tag signature does not match expected key 3C8DFA2DADDDD2213D049B507FDA9B2AAF0E2C0F"
            exit 1
          fi
          echo "Tag signature verified with expected key."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./apps/chrome/dist/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: |
          cd apps/chrome/dist
          zip -r ../../../dacci-chrome.zip .

      - name: Package Firefox extension
        run: |
          cd apps/firefox/dist
          zip -r ../../../dacci-firefox.zip .

      - name: Rename artifacts
        run: |
          mv dacci-chrome.zip dacci-chrome-${{ steps.version.outputs.version }}.zip
          mv dacci-firefox.zip dacci-firefox-${{ steps.version.outputs.version }}.zip

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dacci-chrome-$VERSION.zip dacci-firefox-$VERSION.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dacci-chrome-$VERSION.zip dacci-firefox-$VERSION.zip \
              --title "Dacci v$VERSION" \
              --notes "Automated release of Dacci v$VERSION for Chrome and Firefox."
          fi