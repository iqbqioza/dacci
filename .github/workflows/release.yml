name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify tag signature
        run: |
          EXPECTED_FP="4645F13D0FEE7A8CE2EA5CCD711DE6FEC3464950"
          TAG="$GITHUB_REF_NAME"

          curl -fsSL "https://github.com/iqbqioza.gpg" | gpg --import -

          if ! gpg --list-keys --with-colons "$EXPECTED_FP" | grep -q "^fpr:::::::::$EXPECTED_FP:"; then
            echo "Imported key does not match the expected fingerprint $EXPECTED_FP"
            exit 1
          fi

          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}"

          set +e
          VERIFY_OUTPUT=$(git tag --verify "$TAG" 2>&1)
          VERIFY_STATUS=$?
          set -e
          echo "$VERIFY_OUTPUT"

          if [ $VERIFY_STATUS -ne 0 ]; then
            echo "Tag signature verification failed."
            exit 1
          fi
          echo "Tag signature verified with the expected key."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./apps/chrome/dist/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: |
          cd apps/chrome/dist
          zip -r ../../../dacci-chrome.zip .

      - name: Package Firefox extension
        run: |
          cd apps/firefox/dist
          zip -r ../../../dacci-firefox.zip .

      - name: Rename artifacts
        run: |
          mv dacci-chrome.zip dacci-chrome-${{ steps.version.outputs.version }}.zip
          mv dacci-firefox.zip dacci-firefox-${{ steps.version.outputs.version }}.zip

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dacci-chrome-$VERSION.zip dacci-firefox-$VERSION.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dacci-chrome-$VERSION.zip dacci-firefox-$VERSION.zip \
              --title "Dacci v$VERSION" \
              --notes "Automated release of Dacci v$VERSION for Chrome and Firefox."
          fi